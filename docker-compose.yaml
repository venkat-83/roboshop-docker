name: roboshop
services:
  mongodb:
    build: ./mongodb
    image: venkat/mongodb:v1
    container_name: mongodb 
  catalogue:
    build: ./catalogue
    image: venkat/catalogue:v1
    container_name: catalogue
    depends_on:
    - mongodb
  frontend:
    build: ./frontend
    image: venkat/frontend:v1
    container_name: frontend
    ports:
    - "80:80"
    depends_on:
    - catalogue
networks:
  default:
    name: roboshop
    driver: bridge
    external: false